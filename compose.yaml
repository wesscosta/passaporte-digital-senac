services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: passaporte
      POSTGRES_USER: passaporte
      POSTGRES_PASSWORD: development-only-password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - passaporte_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passaporte -d passaporte"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  passaporte_db:
