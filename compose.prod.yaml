name: conexaosenac
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DJANGO_TRUSTED_PROXIES: ${DJANGO_TRUSTED_PROXIES:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${APP_PORT:-8103}:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client, os; c = http.client.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}); assert c.getresponse().status < 400"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: passaporte
      POSTGRES_USER: passaporte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "passaporte", "-d", "passaporte"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
